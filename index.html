<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Management System</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="loginPage" class="login">
  <div class="login-card">
    <div class="logo">🎓</div>
    <h1>Student Management</h1>
    <p class="subtitle">Admin Login</p>
    <form id="loginForm">
      <div class="group"><label>Username</label><input id="username" required placeholder="Enter username"></div>
      <div class="group"><label>Password</label><input id="password" type="password" required placeholder="Enter password"></div>
      <button class="btn" style="width:100%">Login</button>
    </form>
    <p class="demo">Demo: admin / admin123</p>
  </div>
</div>

<div id="app" class="app">
  <aside class="sidebar">
    <div class="brand">🎓 SMS</div>
    <a class="nav active" onclick="showPage('dashboard',this)">📊 Dashboard</a>
    <a class="nav" onclick="showPage('students',this)">👨‍🎓 Students</a>
    <a class="nav" onclick="logout()">🚪 Logout</a>
  </aside>

  <main class="main">
    <section id="dashboard" class="page active">
      <div class="topbar"><div><h2>Dashboard</h2><p>Welcome back, Sumit</p></div></div>
      <div class="cards">
        <div class="card"><div class="icon">👨‍🎓</div><div><p>Total Students</p><h2 id="totalStudents">0</h2></div></div>
        <div class="card"><div class="icon">📚</div><div><p>Total Courses</p><h2 id="totalCourses">0</h2></div></div>
        <div class="card"><div class="icon">🏫</div><div><p>Department</p><h2>CSE</h2></div></div>
      </div>
      <div class="panel">
        <h2 style="margin-bottom:20px">Quick Actions</h2>
        <div class="actions">
          <button class="action" onclick="openModal()">➕ Add Student</button>
          <button class="action" onclick="showPage('students',document.querySelectorAll('.nav')[1])">👨‍🎓 View Students</button>
        </div>
      </div>
    </section>

    <section id="students" class="page">
      <div class="topbar"><div><h2>Students</h2><p>Manage student records</p></div><button class="btn" onclick="openModal()">+ Add Student</button></div>
      <div class="panel">
        <input class="search" id="search" oninput="searchStudents()" placeholder="Search by name, roll number or course...">
        <div class="table-wrap">
          <table><thead><tr><th>ID</th><th>Name</th><th>Roll No</th><th>Email</th><th>Course</th><th>Semester</th><th>Actions</th></tr></thead>
          <tbody id="studentTable"></tbody></table>
        </div>
      </div>
    </section>
  </main>
</div>

<div id="modal" class="modal">
  <div class="modal-box">
    <div class="modal-head"><h2 id="modalTitle">Add Student</h2><button class="close" onclick="closeModal()">×</button></div>
    <form id="studentForm">
      <input type="hidden" id="studentId">
      <div class="grid">
        <div class="group"><label>Name *</label><input id="name" required></div>
        <div class="group"><label>Roll Number *</label><input id="roll" required></div>
        <div class="group"><label>Email</label><input id="email" type="email"></div>
        <div class="group"><label>Phone</label><input id="phone"></div>
        <div class="group"><label>Course *</label><select id="course" required><option value="">Select Course</option><option>B.Tech CSE</option><option>B.Tech IT</option><option>BCA</option><option>MCA</option></select></div>
        <div class="group"><label>Semester *</label><select id="semester" required><option value="">Select Semester</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select></div>
      </div>
      <button class="btn" type="submit">Save Student</button>
    </form>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
